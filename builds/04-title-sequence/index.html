<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Meridian Title Sequence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Bodoni+Moda:opsz,wght@6..96,400..900&family=IBM+Plex+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
:root{--bg:#000;--ink:#efe6d6;--ember:#ff5a1f;--dim:#8a8274}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
body{display:grid;place-items:center;font-family:"IBM Plex Mono",ui-monospace,monospace}
canvas{display:block}
#gate{position:fixed;inset:0;display:grid;place-content:center;gap:22px;justify-items:center;
  background:rgba(0,0,0,.72);border:0;color:var(--ink);cursor:pointer;font:inherit;
  letter-spacing:.32em;text-transform:uppercase;font-size:12px;padding:16px;text-align:center}
#gate[hidden]{display:none}
#gate .play{display:grid;place-items:center;width:84px;height:84px;border:1px solid var(--ember);border-radius:50%;
  transition:transform .4s cubic-bezier(.2,.8,.2,1),background .4s}
#gate .play::before{content:"";margin-left:6px;border-left:18px solid var(--ember);border-top:11px solid transparent;border-bottom:11px solid transparent}
#gate:hover .play,#gate:focus-visible .play{transform:scale(1.08);background:rgba(255,90,31,.12)}
#gate:focus-visible{outline:none}
#gate .k{color:var(--dim)}
#gate .t{font-size:13px}
</style>
</head>
<body>
<canvas id="c" aria-label="Title sequence for a film called Meridian"></canvas>
<button id="gate" type="button" hidden>
  <span class="t">A title sequence &middot; No. 04</span>
  <span class="play" aria-hidden="true"></span>
  <span class="k" id="gateHint">15 seconds &middot; sound on &middot; space to play</span>
</button>
<script>
"use strict";
/* ============================================================
   MERIDIAN — main title sequence, 15.0 s
   One clock t drives picture and score. Design space 1920x803 (2.39:1).
   ?t=7.2      render one still frame at 7.2 s
   ?autoplay=1 play picture without the click gate (no sound)
   ============================================================ */
const DW = 1920, DH = 803, CX = DW / 2, CY = DH / 2, DUR = 15;
const INK = '#efe6d6', EMBER = '#ff5a1f', DIM = '#8a8274';
const ARCH = 'Archivo, "Arial Narrow", Arial, sans-serif';
const BOD = '"Bodoni Moda", Didot, "Times New Roman", serif';
const MONO = '"IBM Plex Mono", ui-monospace, monospace';

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const off = document.createElement('canvas'), octx = off.getContext('2d');
let S = 1; // device px per design px

/* ---------- math ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOutExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const eOutCubic = x => 1 - Math.pow(1 - x, 3);
const eInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
function hash(a, b = 0) { let h = Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }

/* ---------- improved Perlin noise ---------- */
const P = new Uint8Array(512);
{ const p = [...Array(256).keys()]; let s = 90210; for (let i = 255; i > 0; i--) { s = (s * 16807) % 2147483647; const j = s % (i + 1); [p[i], p[j]] = [p[j], p[i]]; } for (let i = 0; i < 512; i++) P[i] = p[i & 255]; }
const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
function grad(h, x, y, z) { const u = h < 8 ? x : y, v = h < 4 ? y : (h === 12 || h === 14 ? x : z); return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); }
function perlin(x, y, z) {
  let X = Math.floor(x), Y = Math.floor(y), Z = Math.floor(z); x -= X; y -= Y; z -= Z; X &= 255; Y &= 255; Z &= 255;
  const u = fade(x), v = fade(y), w = fade(z);
  const A = P[X] + Y, AA = P[A] + Z, AB = P[A + 1] + Z, B = P[X + 1] + Y, BA = P[B] + Z, BB = P[B + 1] + Z;
  return lerp(lerp(lerp(grad(P[AA] & 15, x, y, z), grad(P[BA] & 15, x - 1, y, z), u), lerp(grad(P[AB] & 15, x, y - 1, z), grad(P[BB] & 15, x - 1, y - 1, z), u), v),
    lerp(lerp(grad(P[AA + 1] & 15, x, y, z - 1), grad(P[BA + 1] & 15, x - 1, y, z - 1), u), lerp(grad(P[AB + 1] & 15, x, y - 1, z - 1), grad(P[BB + 1] & 15, x - 1, y - 1, z - 1), u), v), w);
}

/* ---------- topographic contours (marching squares) ---------- */
const CS = 14, COLS = Math.ceil(DW / CS) + 2, ROWS = Math.ceil(DH / CS) + 2;
const FIELD = new Float32Array(COLS * ROWS);
const SEGS = [[], [3, 2], [2, 1], [3, 1], [0, 1], [3, 0, 2, 1], [0, 2], [3, 0], [3, 0], [0, 2], [0, 1, 3, 2], [0, 1], [3, 1], [2, 1], [3, 2], []];
const LEVELS = []; for (let l = -0.62; l < 1.3; l += 0.105) LEVELS.push(l);

function buildField(tt, seed) {
  const sc = 0.0021;
  for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) {
    const x = (i - 1) * CS, y = (j - 1) * CS;
    const dx = (x - CX) / 430, dy = (y - CY) / 250;
    FIELD[j * COLS + i] = perlin(x * sc + seed, y * sc, tt * 0.07) * 0.95
      + perlin(x * sc * 2.2, y * sc * 2.2 + seed, tt * 0.11 + 7) * 0.32
      + 0.95 * Math.exp(-(dx * dx + dy * dy));
  }
}
function strokeLevels(c) {
  // c: 2d context already transformed into design space
  for (let li = 0; li < LEVELS.length; li++) {
    const L = LEVELS[li], index = li % 5 === 0;
    c.beginPath();
    for (let j = 0; j < ROWS - 1; j++) for (let i = 0; i < COLS - 1; i++) {
      const a = FIELD[j * COLS + i], b = FIELD[j * COLS + i + 1], cc = FIELD[(j + 1) * COLS + i + 1], d = FIELD[(j + 1) * COLS + i];
      const k = (a > L) << 3 | (b > L) << 2 | (cc > L) << 1 | (d > L);
      if (k === 0 || k === 15) continue;
      const x0 = (i - 1) * CS, y0 = (j - 1) * CS, sg = SEGS[k];
      for (let s = 0; s < sg.length; s += 2) {
        for (let e = 0; e < 2; e++) {
          const ed = sg[s + e]; let px, py;
          if (ed === 0) { px = x0 + CS * (L - a) / (b - a); py = y0; }
          else if (ed === 1) { px = x0 + CS; py = y0 + CS * (L - b) / (cc - b); }
          else if (ed === 2) { px = x0 + CS * (L - d) / (cc - d); py = y0 + CS; }
          else { px = x0; py = y0 + CS * (L - a) / (d - a); }
          e ? c.lineTo(px, py) : c.moveTo(px, py);
        }
      }
    }
    c.lineWidth = index ? 2.1 : 1.05;
    c.globalAlpha = index ? 0.62 : 0.3;
    c.stroke();
  }
  c.globalAlpha = 1;
}
// Draws a contour map into the offscreen canvas. reveal = half-width (design px) of the visible band around the meridian.
function contourLayer(tt, { zoom = 1, color = INK, reveal = 9999, seed = 0 }) {
  buildField(tt, seed);
  octx.setTransform(1, 0, 0, 1, 0, 0);
  octx.globalCompositeOperation = 'source-over';
  octx.clearRect(0, 0, off.width, off.height);
  octx.setTransform(S * zoom, 0, 0, S * zoom, (CX - CX * zoom) * S, (CY - CY * zoom) * S);
  octx.strokeStyle = color; octx.lineJoin = 'round';
  strokeLevels(octx);
  if (reveal < DW) {
    const F = 260, R = Math.max(1, reveal);
    octx.setTransform(S, 0, 0, S, 0, 0);
    octx.globalCompositeOperation = 'destination-in';
    const g = octx.createLinearGradient(CX - R - F, 0, CX + R + F, 0), tot = 2 * (R + F);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(F / tot, 'rgba(0,0,0,1)');
    g.addColorStop(1 - F / tot, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    octx.fillStyle = g; octx.fillRect(0, 0, DW, DH);
    octx.globalCompositeOperation = 'source-over';
  }
}

/* ---------- type helpers ---------- */
function setFont(spec, stretch = 'normal') { ctx.font = spec; if ('fontStretch' in ctx) ctx.fontStretch = stretch; }
// Manual tracking so spacing is identical in every browser. align: 'left' | 'center' | 'right'
function spacedWidth(txt, ls) { let w = 0; for (const ch of txt) w += ctx.measureText(ch).width; return w + ls * Math.max(0, [...txt].length - 1); }
function spaced(txt, x, y, ls, align = 'left') {
  const w = spacedWidth(txt, ls); let cx = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  ctx.textAlign = 'left';
  for (const ch of txt) { ctx.fillText(ch, cx, y); cx += ctx.measureText(ch).width + ls; }
  return w;
}
// Digits settle one by one from random figures to their final value.
function scramble(txt, p, t, salt = 0) {
  const chars = [...txt], n = chars.length, fr = Math.floor(t * 30);
  return chars.map((ch, i) => (/\d/.test(ch) && p < (i + 1) / n) ? String(Math.floor(hash(fr + i * 17, salt) * 10)) : ch).join('');
}
function fmtDMS(sec) {
  const d = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return `${d}°${String(m).padStart(2, '0')}′${s.toFixed(1).padStart(4, '0')}″`;
}

/* ---------- film finish: grain, vignette ---------- */
const grains = [];
function buildGrain() {
  for (let n = 0; n < 6; n++) {
    const g = document.createElement('canvas'); g.width = g.height = 256; const gc = g.getContext('2d');
    const img = gc.createImageData(256, 256);
    for (let i = 0; i < img.data.length; i += 4) { const v = Math.floor(hash(i, n + 3) * 255); img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
    gc.putImageData(img, 0, 0); grains.push(ctx.createPattern(g, 'repeat'));
  }
}
function finish(t) {
  const fr = Math.floor(t * 24);
  ctx.setTransform(S, 0, 0, S, 0, 0);
  // vignette
  const v = ctx.createRadialGradient(CX, CY, DH * 0.35, CX, CY, DW * 0.62);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.62)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, DW, DH);
  // grain, re-registered every frame
  const pat = grains[fr % grains.length];
  ctx.save(); ctx.translate(hash(fr, 1) * -256, hash(fr, 2) * -256);
  ctx.fillStyle = pat;
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.16; ctx.fillRect(0, 0, DW + 256, DH + 256);
  ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = 0.035; ctx.fillRect(0, 0, DW + 256, DH + 256);
  ctx.restore();
  // exposure flicker
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = `rgba(0,0,0,${0.015 + hash(fr, 9) * 0.035})`; ctx.fillRect(0, 0, DW, DH);
  // occasional dust
  if (hash(fr, 5) < 0.22) {
    ctx.fillStyle = hash(fr, 6) < 0.5 ? 'rgba(239,230,214,.5)' : 'rgba(0,0,0,.7)';
    ctx.beginPath(); ctx.ellipse(hash(fr, 7) * DW, hash(fr, 8) * DH, 1 + hash(fr, 10) * 2.2, 0.8 + hash(fr, 11) * 1.4, hash(fr, 12) * 3, 0, 7); ctx.fill();
  }
  if (hash(fr, 13) < 0.06) { // hair-thin scratch
    const x = hash(fr, 14) * DW; ctx.fillStyle = 'rgba(239,230,214,.12)'; ctx.fillRect(x, 0, 1, DH);
  }
}

/* ---------- story ---------- */
const CREDITS = [
  { t0: 1.40, t1: 3.60, side: -1, label: 'NORTHLIGHT PICTURES', names: ['PRESENTS'] },
  { t0: 3.80, t1: 5.75, side: 1, label: 'A FILM BY', names: ['ISOLDE VANCE'] },
  { t0: 5.90, t1: 7.85, side: -1, label: 'STARRING', names: ['AUGUST REYES', 'MARA OKONJO', 'THEO LINDQVIST'] },
];
const WORDS = ['EVERY', 'MAP', 'IS', 'A', 'LIE'], W0 = 8.0, WSTEP = 0.3, HIT = 9.6;
const BILLING = [
  [['r', 'NORTHLIGHT PICTURES PRESENTS'], ['r', 'A'], ['n', 'HOLLOWAY / VANCE'], ['r', 'PRODUCTION'], ['r', 'AN'], ['n', 'ISOLDE VANCE'], ['r', 'FILM'], ['n', 'AUGUST REYES'], ['n', 'MARA OKONJO'], ['n', 'THEO LINDQVIST'], ['n', '“MERIDIAN”']],
  [['r', 'CASTING BY'], ['n', 'RUTH ADEYEMI'], ['r', 'MUSIC BY'], ['n', 'HALVARD ESS'], ['r', 'EDITED BY'], ['n', 'JONAS KREEL'], ['r', 'PRODUCTION DESIGNER'], ['n', 'ELENA MARCH'], ['r', 'DIRECTOR OF PHOTOGRAPHY'], ['n', 'SØREN VIK']],
  [['r', 'EXECUTIVE PRODUCERS'], ['n', 'PAUL ATWELL'], ['n', 'DIANE OSEI'], ['r', 'PRODUCED BY'], ['n', 'CLARA HOLLOWAY'], ['r', 'WRITTEN AND DIRECTED BY'], ['n', 'ISOLDE VANCE']],
];

function drawMeridian(t, color) {
  if (t < 0.4) return;
  const h = DH * eOutExpo(seg(t, 0.75, 1.7));
  const fl = 0.86 + 0.14 * hash(Math.floor(t * 24), 21);
  ctx.save();
  ctx.globalAlpha = seg(t, 0.4, 0.75) * fl;
  ctx.shadowColor = EMBER; ctx.shadowBlur = 22;
  ctx.fillStyle = color;
  if (h < 8) { ctx.beginPath(); ctx.arc(CX, CY, 3.2, 0, 7); ctx.fill(); }
  ctx.fillRect(CX - 1.2, CY - h / 2, 2.4, h);
  ctx.restore();
  // graticule ticks travelling north along the line
  const ta = seg(t, 1.7, 2.6) * 0.55;
  if (ta > 0) {
    ctx.fillStyle = color; ctx.globalAlpha = ta;
    const step = 34, o = (t * 22) % step, base = Math.floor(t * 22 / step);
    for (let k = -1, y = o - step; y < DH + step; y += step, k++) {
      const major = ((k - base) % 5 + 5) % 5 === 0, w = major ? 11 : 5;
      ctx.fillRect(CX - 3 - w, y, w, 1.2); ctx.fillRect(CX + 3, y, w, 1.2);
    }
    ctx.globalAlpha = 1;
  }
}

function drawHUD(t, color) {
  const a = seg(t, 1.5, 2.2) * (1 - seg(t, 9.3, 9.45));
  if (a <= 0) return;
  const lon = 11649.6 * (1 - eOutCubic(seg(t, 1.5, 9.4)));
  ctx.globalAlpha = a * 0.62; ctx.fillStyle = color; setFont(`400 14px ${MONO}`);
  ctx.textBaseline = 'alphabetic';
  spaced('N  51°28′38.2″', 72, 74, 3, 'left');
  spaced('W  ' + fmtDMS(lon), 72, 98, 3, 'left');
  spaced('SHEET 07 / 112', DW - 72, 74, 3, 'right');
  spaced('SCALE 1:25 000', DW - 72, 98, 3, 'right');
  spaced('CONTOUR INTERVAL 10 M', 72, DH - 72, 3, 'left');
  spaced('DATUM  WGS 84', DW - 72, DH - 72, 3, 'right');
  ctx.globalAlpha = 1;
}

function drawCredit(c, t) {
  if (t < c.t0 || t > c.t1) return;
  const pin = eOutExpo(seg(t, c.t0, c.t0 + 1.1)), pout = seg(t, c.t1 - 0.45, c.t1);
  const a = seg(t, c.t0, c.t0 + 0.35) * (1 - pout);
  const gap = 64, x = CX + c.side * gap, align = c.side < 0 ? 'right' : 'left';
  const nameSize = c.names.length > 1 ? 50 : 62, lead = nameSize * 1.24;
  const blockH = 34 + lead * c.names.length;
  let y = CY - blockH / 2 + 22;
  // wipe out from the meridian
  const sweep = 1100 * pin;
  ctx.save();
  ctx.beginPath(); c.side < 0 ? ctx.rect(CX - sweep, 0, sweep, DH) : ctx.rect(CX, 0, sweep, DH); ctx.clip();
  if (pout > 0) ctx.filter = `blur(${(pout * 9).toFixed(2)}px)`;
  ctx.globalAlpha = a; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = EMBER; setFont(`500 17px ${MONO}`);
  spaced(c.label, x, y, 7 + 5 * (1 - pin), align);
  y += 34 + nameSize * 0.72;
  ctx.fillStyle = INK; setFont(`300 ${nameSize}px ${ARCH}`, 'expanded');
  const ls = lerp(34, 13, pin) + pout * 10;
  for (const n of c.names) { spaced(n, x, y, ls, align); y += lead; }
  ctx.restore();
}

function drawWord(i, t, inv) {
  const lt = t - (W0 + i * WSTEP), p = clamp(lt / WSTEP);
  const word = WORDS[i], last = i === WORDS.length - 1;
  const size = last ? 330 : 250, s = 1 + 0.14 * (1 - eOutExpo(p));
  ctx.save();
  ctx.translate(CX, CY); ctx.scale(s, s);
  setFont(`900 ${size}px ${ARCH}`, 'ultra-expanded');
  ctx.textBaseline = 'middle';
  const ls = last ? 30 : 18, w = spacedWidth(word, ls), y = size * 0.04;
  const ab = inv ? 0 : (1 - eOutCubic(p)) * 14 + (last ? 4 : 0);
  if (ab > 0.3) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255,40,20,.75)'; spaced(word, -ab, y, ls, 'center');
    ctx.fillStyle = 'rgba(20,200,255,.6)'; spaced(word, ab, y, ls, 'center');
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.fillStyle = inv ? '#0b0a09' : last ? EMBER : INK;
  spaced(word, 0, y, ls, 'center');
  // knockout gap where the meridian cuts through the word (not LIE: its I rides the meridian)
  if (!last) { ctx.fillStyle = inv ? INK : '#000'; ctx.fillRect(-9, -size * 0.42, 18, size * 0.84); }
  // registration label
  ctx.fillStyle = inv ? '#0b0a09' : EMBER; setFont(`500 15px ${MONO}`);
  ctx.textBaseline = 'alphabetic';
  spaced(`0${i + 1} / 05`, w / 2 + 26, -size * 0.3, 4, 'left');
  ctx.restore();
}

function actOne(t, shake) {
  if (t >= HIT - 0.1) return; // 100 ms of true black before the hit
  const wi = t >= W0 ? Math.min(WORDS.length - 1, Math.floor((t - W0) / WSTEP)) : -1;
  const inv = wi === 1 || wi === 3;
  if (inv) { ctx.fillStyle = INK; ctx.fillRect(-20, -20, DW + 40, DH + 40); }
  const zoom = 1 + 0.1 * eInOut(seg(t, 0.6, HIT)) + (wi >= 0 ? 0.03 * (1 - clamp((t - W0 - wi * WSTEP) / WSTEP)) : 0);
  const ca = seg(t, 1.0, 1.8);
  if (ca > 0) {
    contourLayer(t, { zoom, color: inv ? '#0b0a09' : INK, reveal: 1150 * eOutCubic(seg(t, 1.0, 4.4)) });
    ctx.save(); ctx.setTransform(1, 0, 0, 1, shake.x * S, shake.y * S); ctx.globalAlpha = ca * (wi >= 0 ? 0.8 : 0.72); ctx.drawImage(off, 0, 0); ctx.restore();
  }
  drawHUD(t, inv ? '#0b0a09' : INK);
  for (const c of CREDITS) drawCredit(c, t);
  if (wi >= 0) drawWord(wi, t, inv);
  drawMeridian(t, EMBER);
}

/* ---------- title lockup ---------- */
const TITLE = ['M', 'E', 'R', 'I', 'D', 'I', 'A', 'N'], TSIZE = 206, IW = 7;
let TW = null, CAP = 146;
function measureTitle() {
  setFont(`500 ${TSIZE}px ${BOD}`);
  TW = TITLE.map(ch => ch === 'I' ? IW : ctx.measureText(ch).width);
  const m = ctx.measureText('M'); CAP = m.actualBoundingBoxAscent || TSIZE * 0.7;
}
function titleLayout(ls) {
  const xs = []; let x = 0; for (let k = 0; k < TITLE.length; k++) { xs.push(x); x += TW[k] + ls; }
  const off = CX - (xs[3] + IW / 2); // first I sits on the meridian
  return xs.map(v => v + off);
}

function actTwo(t, shake) {
  const out = 1 - seg(t, 14.05, 14.6);
  const glow = eOutCubic(seg(t, HIT, 11.0)) * (1 - seg(t, 13.9, 14.9));
  const BASE = CY + 62, TOP = BASE - CAP;
  // ember world behind the doors
  ctx.fillStyle = '#080403'; ctx.fillRect(-20, -20, DW + 40, DH + 40);
  const g = ctx.createRadialGradient(CX, TOP + CAP / 2, 10, CX, TOP + CAP / 2, 1000);
  g.addColorStop(0, `rgba(255,96,36,${0.34 * glow})`); g.addColorStop(0.45, `rgba(150,40,10,${0.16 * glow})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, DW, DH);
  contourLayer(t + 40, { zoom: 1.28 - 0.22 * eOutCubic(seg(t, HIT, 15)), color: EMBER, seed: 31.7 });
  ctx.save(); ctx.setTransform(1, 0, 0, 1, shake.x * S, shake.y * S); ctx.globalAlpha = 0.2 * glow; ctx.drawImage(off, 0, 0); ctx.restore();

  // the old map splits along the meridian and swings away
  const open = eOutExpo(seg(t, HIT, 10.9));
  if (open < 1) {
    const dx = open * DW * 0.56;
    contourLayer(HIT, { zoom: 1.1 });
    for (const side of [-1, 1]) {
      const px = side < 0 ? -dx : CX + dx;
      ctx.fillStyle = '#000'; ctx.fillRect(px, 0, CX, DH);
      ctx.save(); ctx.setTransform(1, 0, 0, 1, shake.x * S, shake.y * S);
      ctx.globalAlpha = 0.72 * (1 - open);
      const sx = side < 0 ? 0 : CX * S;
      ctx.drawImage(off, sx, 0, CX * S, DH * S, (side < 0 ? -dx : CX + dx) * S, 0, CX * S, DH * S);
      ctx.restore();
      // burning edge of each door
      ctx.save(); ctx.globalAlpha = 1 - open * 0.8; ctx.shadowColor = EMBER; ctx.shadowBlur = 26; ctx.fillStyle = EMBER;
      ctx.fillRect(side < 0 ? CX - dx - 2 : CX + dx, 0, 2, DH); ctx.restore();
    }
  }

  // letters stream out of the meridian

function render(t) {
  t = clamp(t, 0, DUR);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);

/* ---------- score (WebAudio, synthesized) ---------- */
let AC = null, comp = null, bus = null, verb = null, noiseBuf = null, T0 = 0;
function audioInit() {

  comp.threshold.value = -16; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.25;
  comp.connect(AC.destination);

function env(g, t, a, peak, d) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }

  f.type = 'highpass'; f.frequency.value = 6500; env(g, t, 0.001, amp, 0.04); p.pan.value = pan;
  n.connect(f); f.connect(g); g.connect(p); send(p, 1, 0.25); n.start(t, Math.random()); n.stop(t + 0.08);
}
function ping(t, f, amp) {

/* ---------- playback ---------- */
const gate = document.getElementById('gate'), hint = document.getElementById('gateHint');
let playing = false, clockStart = 0, useAudio = false, rafId = 0;
// Picture follows the audio clock for sync; if that clock never starts (no output device), fall back to the wall clock.
function now() {
  const pt = (performance.now() - clockStart) / 1000;
  if (useAudio) { const at = AC.currentTime - T0; if (AC.state === 'running' && at > -0.14) return at; if (pt > 1) useAudio = false; }
  return pt;
}
function play(withAudio) {
  cancelAnimationFrame(rafId);
  gate.hidden = true; playing = true; useAudio = false;
  if (withAudio) {
    try { score(); AC.resume(); useAudio = true; } catch (e) { useAudio = false; }
  }
  clockStart = performance.now() + 150;
  rafId = requestAnimationFrame(loop);
}
function loop() {
  if (!playing) return;
  const t = now();
  render(Math.max(0, t));
  if (t < DUR + 0.25) rafId = requestAnimationFrame(loop);
  else { playing = false; render(DUR); hint.textContent = 'play again · space'; gate.hidden = false; gate.focus(); }
}
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const s = Math.min(innerWidth / DW, innerHeight / DH);
  const w = Math.max(1, Math.floor(DW * s)), h = Math.max(1, Math.floor(DH * s));
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  cv.width = off.width = Math.round(w * dpr); cv.height = off.height = Math.round(h * dpr);
  S = cv.width / DW;
}

const params = new URLSearchParams(location.search);
(async function boot() {
  resize(); buildGrain();
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
  const wait = ms => new Promise(r => setTimeout(r, ms));
  try {
    await Promise.race([Promise.all([
      document.fonts.load(`300 62px Archivo`), document.fonts.load(`900 250px Archivo`),
      document.fonts.load(`500 206px "Bodoni Moda"`), document.fonts.load(`500 17px "IBM Plex Mono"`), document.fonts.load(`400 14px "IBM Plex Mono"`),
    ]), wait(3000)]);

  measureTitle();
  const still = params.has('t') ? parseFloat(params.get('t')) : null;
  addEventListener('resize', () => { resize(); if (!playing) render(still ?? 0); });
  if (still !== null && !Number.isNaN(still)) { render(still); document.body.dataset.ready = '1'; return; }

  gate.addEventListener('click', () => play(true));
  addEventListener('keydown', e => {

})();
